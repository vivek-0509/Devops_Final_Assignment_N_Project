# Session 20 - Monitoring stack: Prometheus (metrics + alerts), node-exporter (host metrics),
# cAdvisor (container CPU/memory), a sample app (nginx) and Grafana (dashboards)
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: session20-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: session20-node-exporter
    ports:
      - "9100:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: session20-cadvisor
    privileged: true
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  sample-app:
    image: nginx:alpine
    container_name: session20-sample-app
    ports:
      - "8086:80"
    volumes:
      - ./nginx-status.conf:/etc/nginx/conf.d/default.conf:ro

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: session20-nginx-exporter
    command:
      - --nginx.scrape-uri=http://sample-app/stub_status
    ports:
      - "9113:9113"
    depends_on:
      - sample-app

  grafana:
    image: grafana/grafana:11.6.0
    container_name: session20-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
