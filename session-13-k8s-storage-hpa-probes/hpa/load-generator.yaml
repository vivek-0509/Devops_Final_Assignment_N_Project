# In-cluster load generator: 3 Pods hammer the backend Service in a tight loop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  labels:
    app: load-generator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command:
            - sh
            - -c
            - "while true; do wget -q -O- http://yatri-backend-service/healthz > /dev/null 2>&1; done"
          resources:
            requests:
              cpu: "20m"
              memory: "16Mi"
