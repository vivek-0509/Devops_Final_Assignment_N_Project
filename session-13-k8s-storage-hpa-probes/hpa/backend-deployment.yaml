# CPU-bound backend used for the HPA demo (same app as the Session 12 backend).
# The HPA compares usage against the CPU *request* (50m), so a small request makes scaling easy to observe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  labels:
    app: yatri-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
    spec:
      containers:
        - name: backend
          image: python:3.11-alpine3.19
          command:
            - "sh"
            - "-c"
            - |
              python3 -c "
              import hashlib
              from http.server import HTTPServer, BaseHTTPRequestHandler
              class Handler(BaseHTTPRequestHandler):
                  def log_message(self, format, *args):
                      pass
                  def do_GET(self):
                      # burn a little CPU per request so load is visible to the HPA
                      h = b'x'
                      for _ in range(2000):
                          h = hashlib.sha256(h).digest()
                      body = b'Yatri Backend API - healthy\n'
                      self.send_response(200)
                      self.send_header('Content-Type', 'text/plain')
                      self.send_header('Content-Length', str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
              HTTPServer(('0.0.0.0', 5000), Handler).serve_forever()
              "
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
