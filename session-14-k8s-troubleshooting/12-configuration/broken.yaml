# Configuration issue: the app requires DATABASE_URL but nothing sets it -> CrashLoopBackOff
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine
      command:
        - "python3"
        - "-c"
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print(f"Application started successfully! DATABASE_URL={db_url}")
          while True:
              time.sleep(30)
