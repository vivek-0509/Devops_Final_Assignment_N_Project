apiVersion: v1
kind: ConfigMap
metadata:
  name: app-env
data:
  DATABASE_URL: "postgresql://app@postgres.default.svc.cluster.local:5432/appdb"
---
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine
      envFrom:
        - configMapRef:
            name: app-env
      command:
        - "python3"
        - "-c"
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print(f"Application started successfully! DATABASE_URL={db_url}")
          while True:
              time.sleep(30)
