# Pod networking issue: the container listens on 8080 but the Service targets port 80
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netapp
  template:
    metadata:
      labels:
        app: netapp
    spec:
      containers:
        - name: app
          image: gcr.io/google-samples/hello-app:1.0   # listens on 8080
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: netapp
spec:
  selector:
    app: netapp
  ports:
    - port: 80
      targetPort: 80          # <-- wrong: should be 8080
